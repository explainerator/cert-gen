[package]
name = "cert-gen"
version = "0.1.0"
edition = "2021"
description = "Generate mTLS client certificates signed by a CA stored in OVHCloud OKMS"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
time = "0.3"
toml = "0.8"
urlencoding = "2"
